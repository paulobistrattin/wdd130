<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - The Rafting Giants</title>
    <meta name="description" content="Contact The Rafting Giants for general inquiries, trip reservations, or feedback. Get in touch with our team today!">
    <meta name="author" content="Paulo Emanuel Bistrattin Duarte Machado">
    <link rel="stylesheet" href="styles/rafting.css">
  </head>
  <body>
    <header>
      <img src="images/logo.png" alt="The Rafting Giants Logo">
      <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="trips.html">Trips</a>
        <a href="contact.html">Contact Us</a>
      </nav>
    </header>
    <main>
      <section class="company-info">
        <h1>Contact Us - The Rafting Giants</h1>
        <p><strong>Address:</strong> 123 River Run Rd, Salmon, ID 83467</p>
        <p><strong>Phone:</strong> (555) 123-4567</p>
        <p><strong>Email:</strong> info@theraftinggiants.com</p>
        <iframe 
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3375965.4208970373!2d-116.06749794294466!3d34.278100619383835!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8737e89b70298547%3A0x165dff811dd0901e!2sRio%20Colorado!5e0!3m2!1spt-BR!2sus!4v1785460477924!5m2!1spt-BR!2sus" 
          title="Colorado River Map"
          width="600" 
          height="450" 
          loading="lazy" 
          referrerpolicy="strict-origin-when-cross-origin">
        </iframe>
      </section>
      <section class="employees">
        <h2>Meet Our Team</h2>
        <figure>
          <img src="images/employee1.jpg" alt="Photo of Thiago, Lead River Guide">
          <figcaption>Thiago Martins - Lead River Guide</figcaption>
        </figure>
        <figure>
          <img src="images/employee2.jpg" alt="Photo of Lucas, Operations Manager">
          <figcaption>Lucas Silva - Operations Manager</figcaption>
        </figure>
        <figure>
          <img src="images/employee3.jpg" alt="Photo of Bobby, Safety Officer">
          <figcaption>Robert Magoon - Safety Officer</figcaption>
        </figure>
      </section>
      <section class="contact-form">
        <h2>Send Us a Message</h2>
        <form action="#" method="post">
          <div class="form-item">
            <label for="username">Name:</label>
            <input type="text" id="username" name="username" required>
          </div>

          <div class="form-item">
            <label for="useremail">Email Address:</label>
            <input type="email" id="useremail" name="useremail" required>
          </div>

          <fieldset class="form-item">
            <legend>Purpose of Message:</legend>
            <label><input type="radio" id="general" name="purpose" value="general" checked> General Inquiry</label>
            <label><input type="radio" id="reservation" name="purpose" value="reservation"> Reservation Question</label>
            <label><input type="radio" id="suggestion" name="purpose" value="suggestion"> Website Suggestion</label>
          </fieldset>

          <div class="form-item">
            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="5" required></textarea>
          </div>

          <div class="form-item">
            <label>
              <input type="checkbox" id="newsletter" name="newsletter" value="subscribe">
              Please subscribe me to the monthly newsletter
            </label>
          </div>

          <button type="submit">Send Message</button>
        </form>
      </section>
    </main>
    <footer>
      <p>© 2026 🏄‍♂️ The Rafting Giants 🏄‍♂️ Paulo Emanuel Bistrattin Duarte Machado</p>
      <nav class="socialmedia">
        <a href="https://facebook.com" target="_blank">
          <img src="images/facebook.png" alt="Facebook Icon">
        </a>
        <a href="https://linkedin.com" target="_blank">
          <img src="images/linkedin.png" alt="LinkedIn Icon">
        </a>
        <a href="https://instagram.com" target="_blank">
          <img src="images/instagram.jpg" alt="Instagram Icon">
        </a>
      </nav>
    </footer>
  </body>
</html>
